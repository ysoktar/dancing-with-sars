<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dancing with the SARs: NISAR surface change explorer</title>
  <meta name="description" content="Explore real NISAR L-band radar observations on a 3D globe: surface change, ground motion, machine-learning analysis and forecasts." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d10'/%3E%3Cpath d='M5 18c3-5 5 5 8 0s5 5 8 0 4 3 6 1' stroke='%23e8b04a' stroke-width='2.4' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="#/">Dancing with the SARs</a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="globe">Globe</a>
      <a href="#/sites" data-route="sites">Sites</a>
      <a href="#/method" data-route="method">What radar can tell</a>
      <a href="#/data" data-route="data">Data &amp; methods</a>
    </nav>
    <div class="bar-meta" id="barMeta"></div>
  </header>

  <main class="stage">
    <div id="globeViz" class="globe"></div>

    <aside class="rail" id="rail">
      <div class="rail-intro">
        <p>The globe is covered with real radar images from the NASA–ISRO <b>NISAR</b> satellite, one complete 12-day orbit cycle at a time. Press play to watch the world change, or pick a site to see what changed there and why.</p>
      </div>
      <div class="rail-list" id="railList"></div>
    </aside>

    <div class="layers" id="layers">
      <button class="layers-toggle" id="layersToggle" aria-expanded="false">Layers</button>
      <div class="layers-menu" id="layersMenu">
        <label id="mosaicLayer"><input type="checkbox" data-layer="mosaic" checked> NISAR world mosaic <span class="muted small" id="mosaicDates"></span></label>
        <label><input type="checkbox" data-layer="frames" checked> Study-site frames (by date)</label>
        <label><input type="checkbox" data-layer="density"> Acquisitions per month</label>
        <label><input type="checkbox" data-layer="footprints"> Frame outlines (sample)</label>
        <label><input type="checkbox" data-layer="events"> Natural events (EONET)</label>
        <label><input type="checkbox" data-layer="satellite" checked> NISAR satellite, orbit &amp; swath</label>
        <label><input type="checkbox" data-layer="night"> Night side lights</label>
      </div>
    </div>

    <div class="timeline" id="timeline">
      <button id="playBtn" class="play" aria-label="Play timeline"><svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <span id="tlDate" class="tl-date"></span>
      <input id="tlRange" type="range" min="0" max="100" value="100" step="1" aria-label="Date" />
    </div>

    <!-- pages open in front of the globe -->
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
