name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Re-download the latest NISAR acquisitions before building"
        type: boolean
        default: true
  schedule:
    # weekly refresh: new NISAR passes every 12 days per track
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'schedule' || inputs.refresh_data
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh NISAR data (ASF + NASA CMR, no login needed)
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/build_data.py --workers 8
          python pipeline/build_motion.py --workers 8
          python pipeline/build_dem.py

      - name: Refresh events and news (EONET, USGS, GDELT)
        run: python3 pipeline/build_events.py || echo "event refresh failed, keeping committed events.json"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
